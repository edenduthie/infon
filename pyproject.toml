[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "infon"
version = "0.1.0"
description = "Knowledge graph reasoner with calibrated Dempster-Shafer uncertainty. SPLADE sparse retrieval + MCTS multi-hop reasoning + sheaf GNN."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "numpy>=1.24",
    "scipy>=1.11",
    "requests>=2.31",
]

[project.optional-dependencies]
aws = ["boto3>=1.28"]
study = ["boto3>=1.28", "scikit-learn>=1.3", "matplotlib>=3.7"]
all = ["boto3>=1.28", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.scripts]
infon = "infon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infon = ["model/*"]
